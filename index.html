<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Earth Mines Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Землисто-оранжевая палитра */
            --bg-earth: #120A07;
            --card-earth: #23140E;
            --cell-earth: #361F17;
            --cell-hover: #4A2B20;
            --orange-bright: #FF6B00;
            --orange-glow: rgba(255, 107, 0, 0.35);
            --orange-light: #FF9443;
            --text-main: #FFF3EC;
            --text-muted: #A88F81;
            --danger-red: #D32F2F;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-earth);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            user-select: none;
        }

        /* Анимация загрузки */
        #loader {
            position: fixed;
            inset: 0;
            background: var(--bg-earth);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.4s ease, visibility 0.4s;
        }

        .loader-ring {
            width: 65px;
            height: 65px;
            border: 4px solid rgba(255, 107, 0, 0.15);
            border-top: 4px solid var(--orange-bright);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            box-shadow: 0 0 20px var(--orange-glow);
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* Верхняя панель */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: var(--card-earth);
            border-bottom: 1px solid rgba(255, 107, 0, 0.1);
        }

        .user-info {
            font-weight: 600;
            color: var(--text-main);
        }

        .balance-badge {
            background: rgba(255, 107, 0, 0.15);
            border: 1px solid var(--orange-bright);
            padding: 6px 14px;
            border-radius: 20px;
            color: var(--orange-bright);
            font-weight: 800;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 10px var(--orange-glow);
        }

        /* Навигация снизу */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-earth);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid rgba(255, 107, 0, 0.15);
            z-index: 100;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--orange-bright);
        }

        .container {
            padding: 16px 20px 80px;
            flex: 1;
        }

        .page { display: none; }
        .page.active { display: block; }

        /* Баннер главного меню */
        .hero-banner {
            background: linear-gradient(135deg, #3D2014 0%, #23140E 100%);
            border: 1px solid var(--orange-bright);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px var(--orange-glow);
            position: relative;
            overflow: hidden;
        }

        .hero-banner h2 {
            color: var(--orange-bright);
            margin-bottom: 8px;
            font-size: 20px;
        }

        .hero-banner p {
            color: var(--text-muted);
            font-size: 13px;
        }

        /* Сетка выбора игр в Главном Меню */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .game-card {
            background: var(--card-earth);
            border: 1px solid rgba(255, 107, 0, 0.15);
            border-radius: 16px;
            padding: 20px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .game-card:active {
            transform: scale(0.96);
            border-color: var(--orange-bright);
        }

        .game-card .icon {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .game-card .title {
            font-weight: 800;
            font-size: 15px;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .game-card .badge {
            font-size: 11px;
            color: var(--orange-bright);
            background: rgba(255, 107, 0, 0.1);
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
        }

        /* Кнопка Назад из игры */
        .back-btn {
            background: none;
            border: none;
            color: var(--orange-bright);
            font-size: 15px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 16px;
            cursor: pointer;
        }

        /* Панель настройки ставок */
        .panel {
            background: var(--card-earth);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(255, 107, 0, 0.15);
            margin-bottom: 16px;
        }

        .panel-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .panel-row:last-child { margin-bottom: 0; }

        .panel-label {
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
        }

        select, input {
            background: var(--cell-earth);
            border: 1px solid var(--orange-bright);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 10px;
            font-weight: 700;
            outline: none;
        }

        /* Сетка Ячеек "Мин" */
        .mines-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .cell {
            aspect-ratio: 1;
            background: var(--cell-earth);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            cursor: pointer;
            border: 1px solid rgba(255, 107, 0, 0.1);
            transition: transform 0.15s ease, background-color 0.2s;
        }

        .cell:hover:not(.open) {
            background: var(--cell-hover);
        }

        .cell:active:not(.open) {
            transform: scale(0.92);
        }

        /* 3D Переворот */
        .cell.open {
            animation: flip 0.35s ease forwards;
            cursor: default;
        }

        @keyframes flip {
            0% { transform: rotateY(0deg); }
            50% { transform: rotateY(90deg); }
            100% { transform: rotateY(0deg); }
        }

        .cell.gem {
            background: rgba(255, 107, 0, 0.2);
            border: 1px solid var(--orange-bright);
            box-shadow: 0 0 12px var(--orange-glow);
        }

        .cell.mine {
            background: rgba(211, 47, 47, 0.25);
            border: 1px solid var(--danger-red);
            animation: shake 0.3s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* Кнопки */
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
        }

        .btn-orange {
            background: linear-gradient(135deg, #FF8800 0%, #FF5500 100%);
            color: #FFF;
            box-shadow: 0 4px 15px var(--orange-glow);
        }

        .btn-orange:active {
            transform: scale(0.98);
        }

        /* Профиль */
        .stat-card {
            background: var(--card-earth);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(255, 107, 0, 0.15);
            margin-bottom: 12px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 107, 0, 0.08);
        }

        .stat-row:last-child { border-bottom: none; }
    </style>
</head>
<body>

    <div id="loader">
        <div class="loader-ring"></div>
        <p style="margin-top: 20px; font-weight: 700; color: var(--orange-bright);">ЗЕМЛЯНЫЕ МИНЫ...</p>
    </div>

    <div class="header">
        <div class="user-info" id="user-name">Шахтёр</div>
        <div class="balance-badge">
            <span id="balance-val">100</span> ⭐️
        </div>
    </div>

    <div class="container">
        <div id="menu-page" class="page active">
            <div class="hero-banner">
                <h2>Выбирай режим</h2>
                <p>Добывай Stars в подземных шахтах!</p>
            </div>

            <div class="games-grid">
                <div class="game-card" onclick="openGame('mines')">
                    <div class="icon">⛏️</div>
                    <div class="title">Мины</div>
                    <div class="badge">Популярно</div>
                </div>
                <div class="game-card" style="opacity: 0.5; cursor: not-allowed;">
                    <div class="icon">🎰</div>
                    <div class="title">Слоты</div>
                    <div class="badge">Скоро</div>
                </div>
                <div class="game-card" style="opacity: 0.5; cursor: not-allowed;">
                    <div class="icon">🚀</div>
                    <div class="title">Ракета</div>
                    <div class="badge">Скоро</div>
                </div>
                <div class="game-card" style="opacity: 0.5; cursor: not-allowed;">
                    <div class="icon">🎴</div>
                    <div class="title">Карты</div>
                    <div class="badge">Скоро</div>
                </div>
            </div>
        </div>

        <div id="mines-page" class="page">
            <button class="back-btn" onclick="openMenu()">← Назад в меню</button>

            <div class="panel">
                <div class="panel-row">
                    <span class="panel-label">Ставка (⭐️):</span>
                    <input type="number" id="bet-input" value="10" min="1" style="width: 80px;">
                </div>
                <div class="panel-row">
                    <span class="panel-label">Мин на поле:</span>
                    <select id="mines-select" onchange="updateX()">
                        </select>
                </div>
                <div class="panel-row">
                    <span class="panel-label">Текущий X:</span>
                    <span id="multiplier-val" style="color: var(--orange-bright); font-weight: 800;">x1.00</span>
                </div>
            </div>

            <div class="mines-grid" id="grid"></div>

            <button class="btn btn-orange" id="main-btn" onclick="handleMainAction()">Начать игру</button>
        </div>

        <div id="profile-page" class="page">
            <div class="stat-card">
                <div class="stat-row">
                    <span>Выиграно:</span>
                    <strong id="wins-count" style="color: var(--orange-bright);">0</strong>
                </div>
                <div class="stat-row">
                    <span>Проиграно:</span>
                    <strong id="losses-count" style="color: var(--danger-red);">0</strong>
                </div>
                <div class="stat-row">
                    <span>Всего выведено:</span>
                    <strong id="withdraws-count" style="color: var(--orange-bright);">0 ⭐️</strong>
                </div>
            </div>

            <button class="btn btn-orange" onclick="addTestBalance()">+100 Тестовых Stars ⭐️</button>
        </div>
    </div>

    <div class="bottom-nav">
        <button class="nav-item active" onclick="switchNav('menu')">
            <span>🎮</span>
            <span>Игры</span>
        </button>
        <button class="nav-item" onclick="switchNav('profile')">
            <span>👤</span>
            <span>Профиль</span>
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let balance = 100;
        let wins = 0;
        let losses = 0;
        let totalWithdrawn = 0;

        let gameActive = false;
        let minesCount = 3;
        let betAmount = 10;
        let minePositions = [];
        let openedGems = 0;
        let currentMultiplier = 1.0;

        // Генерация списка мин от 1 до 24
        const select = document.getElementById('mines-select');
        for (let i = 1; i <= 24; i++) {
            const opt = document.createElement('option');
            opt.value = i;
            opt.innerText = i;
            if (i === 3) opt.selected = true;
            select.appendChild(opt);
        }

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('user-name').innerText = tg.initDataUnsafe.user.first_name;
        }

        // Лоадер
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 400);
            }, 600);
        });

        // Навигация по разделам
        function switchNav(tab) {
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));

            if (tab === 'menu') {
                document.querySelectorAll('.nav-item')[0].classList.add('active');
                document.getElementById('menu-page').classList.add('active');
            } else if (tab === 'profile') {
                document.querySelectorAll('.nav-item')[1].classList.add('active');
                document.getElementById('profile-page').classList.add('active');
            }
        }

        function openGame(gameType) {
            if (gameType === 'mines') {
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                document.getElementById('mines-page').classList.add('active');
            }
        }

        function openMenu() {
            if (gameActive) {
                if (!confirm('Игра идет! Вы уверены, что хотите выйти и потерять ставку?')) return;
                gameActive = false;
                endGame(false);
            }
            switchNav('menu');
        }

        // Инициализация сетки 5x5
        const grid = document.getElementById('grid');
        function initGrid() {
            grid.innerHTML = '';
            for (let i = 0; i < 25; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.dataset.index = i;
                cell.addEventListener('click', () => onCellClick(cell, i));
                grid.appendChild(cell);
            }
        }
        initGrid();

        function updateX() {
            if (!gameActive) {
                document.getElementById('multiplier-val').innerText = 'x1.00';
                return;
            }
            let mult = 1.0;
            for (let i = 0; i < openedGems; i++) {
                mult *= (25 - i) / (25 - minesCount - i);
            }
            currentMultiplier = mult;
            document.getElementById('multiplier-val').innerText = 'x' + mult.toFixed(2);
        }

        function handleMainAction() {
            if (!gameActive) {
                startGame();
            } else {
                takeWin();
            }
        }

        function startGame() {
            betAmount = parseInt(document.getElementById('bet-input').value) || 10;
            minesCount = parseInt(document.getElementById('mines-select').value);

            if (balance < betAmount) {
                alert('Недостаточно Stars!');
                return;
            }

            balance -= betAmount;
            openedGems = 0;
            gameActive = true;
            
            minePositions = [];
            while (minePositions.length < minesCount) {
                let r = Math.floor(Math.random() * 25);
                if (!minePositions.includes(r)) minePositions.push(r);
            }

            initGrid();
            updateUI();
            
            document.getElementById('bet-input').disabled = true;
            document.getElementById('mines-select').disabled = true;

            const btn = document.getElementById('main-btn');
            btn.innerText = 'Забрать (0 ⭐️)';
        }

        function onCellClick(cell, index) {
            if (!gameActive || cell.classList.contains('open')) return;

            cell.classList.add('open');

            if (minePositions.includes(index)) {
                // Попал на мину
                cell.classList.add('mine');
                cell.innerText = '💣';
                gameActive = false;
                losses++;
                revealMines();
                endGame(false);
            } else {
                // Открыл кристалл
                cell.classList.add('gem');
                cell.innerText = '💎';
                openedGems++;
                updateX();

                let winAmount = Math.floor(betAmount * currentMultiplier);
                document.getElementById('main-btn').innerText = `Забрать ${winAmount} ⭐️`;

                if (openedGems === (25 - minesCount)) {
                    takeWin();
                }
            }
        }

        function takeWin() {
            if (!gameActive || openedGems === 0) return;
            
            let winAmount = Math.floor(betAmount * currentMultiplier);
            balance += winAmount;
            totalWithdrawn += winAmount;
            wins++;
            gameActive = false;
            endGame(true, winAmount);
        }

        function revealMines() {
            const cells = document.querySelectorAll('.cell');
            minePositions.forEach(pos => {
                cells[pos].classList.add('open', 'mine');
                cells[pos].innerText = '💣';
            });
        }

        function endGame(isWin, amount = 0) {
            document.getElementById('bet-input').disabled = false;
            document.getElementById('mines-select').disabled = false;

            const btn = document.getElementById('main-btn');
            btn.innerText = 'Начать игру';

            updateUI();

            setTimeout(() => {
                if (isWin) {
                    alert(`Отлично! Забрали ${amount} ⭐️`);
                } else {
                    alert('Бум! Мина взорвалась.');
                }
            }, 200);
        }

        function addTestBalance() {
            balance += 100;
            updateUI();
            alert('Зачислено +100 ⭐️!');
        }

        function updateUI() {
            document.getElementById('balance-val').innerText = balance;
            document.getElementById('wins-count').innerText = wins;
            document.getElementById('losses-count').innerText = losses;
            document.getElementById('withdraws-count').innerText = totalWithdrawn + ' ⭐️';
        }
    </script>
</body>
</html>
